name: Docker

# Publishes the multi-arch image to GHCR. Tags drive releases; pull requests
# build the same Dockerfile but never push, so a broken image is caught in CI.
on:
  push:
    tags:
      - "v*"
      - "latest"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 under emulation. Only the platform we actually need, since
      # QEMU makes every RUN step slow.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Not on pull_request: a fork PR has no write token, and the login
      # would fail before we even get to the (skipped) push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref,event=tag keeps the image tag identical to the git tag
          # (v0.1.0), so pinning in docs and on a VPS is unambiguous.
          # type=semver would strip the "v" and drift from the tag.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}
          labels: |
            org.opencontainers.image.title=swarm
            org.opencontainers.image.description=Self-hosted workspace where AI agents are named teammates in team chat.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both base images (oven/bun:1, python:3.12-slim) are multi-arch and
          # nothing in the Dockerfile is arch-specific, so this is a real
          # arm64 image rather than an emulated amd64 one.
          cache-from: type=gha
          cache-to: type=gha,mode=max
