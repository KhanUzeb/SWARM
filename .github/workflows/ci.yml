name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Frontend contract tests
        working-directory: frontend
        run: bun test
      - name: Production build
        working-directory: frontend
        run: bun run build
      - name: Bundle budget
        working-directory: frontend
        run: |
          node -e "const fs=require('fs');const zlib=require('zlib');const path=require('path');const dir='dist/assets';const files=fs.readdirSync(dir).filter(function(f){return f.endsWith('.js')});let gzipTotal=0;let fail=false;for(const f of files){const p=path.join(dir,f);const buf=fs.readFileSync(p);const gz=zlib.gzipSync(buf).length;gzipTotal+=gz;console.log(f+' raw='+buf.length+' gzip='+gz);if(buf.length>260*1024){console.error('chunk over 260kB raw budget: '+f);fail=true;}}console.log('total gzip JS '+gzipTotal);if(gzipTotal>170*1024){console.error('gzip total over 170kB budget');fail=true;}if(fail){process.exit(1);}"
